services:
  db:
    image: postgres:16-alpine
    container_name: orbit-db
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit
      POSTGRES_DB: orbit
    ports:
      - "5433:5432"
    volumes:
      - orbit-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  orbit-pgdata:
